[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-manager"
version = "0.1.0"
description = "Vehicle settings and logs with explicit technical ownership"
dependencies = ["senior-contracts==0.1.0", "pydantic>=2.8,<3", "aiosqlite>=0.20,<1"]
requires-python = ">=3.10"

[project.optional-dependencies]
agent = ["httpx>=0.27,<1", "websockets>=14,<16"]

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_manager"]

[tool.uv.sources]
senior-contracts = { path = "../contracts", editable = true }
