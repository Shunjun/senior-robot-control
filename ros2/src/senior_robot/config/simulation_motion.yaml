# Fortress-only no-attachment shared motion core baseline.
# Values require runtime measurement and do not qualify hardware.
scan_receipt:
  ros__parameters:
    use_sim_time: true
    scan_ledger_max_age_s: 3.0
scan_adapter:
  ros__parameters:
    use_sim_time: true
    body_frame: base_link
    no_return_clear: false
safety_scan_ingress:
  ros__parameters:
    use_sim_time: true
    body_frame: base_link
scan_motion_node:
  ros__parameters:
    use_sim_time: true
    body_frame: base_link
    max_interval_ms: 400.0
    max_linear_speed: 0.5
    max_yaw_rate: 0.8
    range_limit: 8.0
    min_response: 0.3
    max_residual: 0.09
    min_inlier_fraction: 0.55
    min_spread: 0.04
    min_translation_observability: 0.05
    min_yaw_observability: 0.01
    max_variance: 0.05
    reanchor_distance: 0.12
    reanchor_yaw: 0.1
    min_rays: 100
safety_gate:
  ros__parameters:
    wheel_frame: odom
    # fortress-candidate-unvalidated-v1 requires localhost + simulated clock.
    # See simulation_motion_profile.py for individual evidence vs assumptions.
    motion_core_profile: fortress-candidate-unvalidated-v1
    startup_learning_front_occlusion_stop: true
    startup_learning_rear_occlusion_stop: true
    use_sim_time: true
    # This earlier motion-only fixture deliberately does not qualify low obstacles.
    depth_policy: laser_only
    body_frame: base_link
    simulation_rate_hz: 20.0
    footprint_xy: [-0.337, -0.276, 0.337, -0.276, 0.337, 0.276, -0.337, 0.276]
command_node:
  ros__parameters:
    use_sim_time: true
    command_rate_hz: 10.0
    command_ttl_ms: 300.0
