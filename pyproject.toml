[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "senior-control"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["senior-navigation==0.1.0", "senior-robot==0.1.0", "vehicle-manager==0.1.0", "vehicle-cloud==0.1.0", "senior-localization==0.1.0", "senior-mapping==0.1.0", "senior-motion-control==0.1.0", "senior-motion-estimation==0.1.0", "senior-perception==0.1.0", "senior-contracts==0.1.0", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyYAML>=6,<7", "aiosqlite>=0.20,<1"]


[project.optional-dependencies]
safety = [
    "shapely>=2,<3",
]
ros = [
    # Compatible: Humble cv_bridge is built against NumPy 1 on Ubuntu 22.04 / Python 3.10.
    "numpy>=1.24,<2; sys_platform == 'linux' and python_version == '3.10'",
]
agent = [
    "vehicle-manager[agent]==0.1.0",
]
cloud = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]
video = [
    "vehicle-manager[video]==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-shapely>=2.1.0.20260728",
    "lefthook==2.2.2",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
pythonpath = ["senior_control/src", "senior_control/tests", "cloud/src", "cloud/tests", "tests/integration", "ros2/src/senior_mapping/scripts", "ros2/src/senior_mapping/test", "ros2/src/senior_localization", "ros2/src/senior_mapping", "ros2/src/senior_motion_estimation", "ros2/src/senior_motion_estimation/test", "ros2/src/senior_perception", "ros2/src/senior_perception/test", "ros2/tests", "tests/unit", "ros2/src/senior_sensor_ingress", ".", "src", "contracts/src", "ros2/src/senior_robot", "ros2/src/senior_navigation", "ros2/src/senior_motion_control"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
senior-navigation = { path = "ros2/src/senior_navigation", editable = true }
senior-robot = { path = "ros2/src/senior_robot", editable = true }
vehicle-manager = { path = "senior_control", editable = true }
vehicle-cloud = { path = "cloud", editable = true }
senior-localization = { path = "ros2/src/senior_localization", editable = true }
senior-mapping = { path = "ros2/src/senior_mapping", editable = true }
senior-motion-control = { path = "ros2/src/senior_motion_control", editable = true }
senior-motion-estimation = { path = "ros2/src/senior_motion_estimation", editable = true }
senior-perception = { path = "ros2/src/senior_perception", editable = true }
senior-contracts = { path = "contracts", editable = true }
