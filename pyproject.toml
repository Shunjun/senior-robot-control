[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "senior-control"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyYAML>=6,<7", "aiosqlite>=0.20,<1"]

[project.optional-dependencies]
safety = [
    "shapely>=2,<3",
]
cloud = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-shapely>=2.1.0.20260728",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
