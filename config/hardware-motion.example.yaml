# Site overrides; software algorithms/default frames are supplied by real_runtime.py.
# Confirm the nominal vendor frames/topics and actual rigid mounting before enabling motion.
# These false values are intentional missing-calibration diagnostics, not null algorithm knobs.
scan_adapter:
  ros__parameters:
    self_mask_calibrated: false
    transform_static: false
safety_scan_ingress:
  ros__parameters:
    transform_static: false
scan_motion_node:
  ros__parameters:
    transform_static: false
safety_gate:
  ros__parameters:
    self_mask_calibrated: false
    transform_static: false
